apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - ../../base

images:
  - name: accounts
    newName: localhost:32000/accounts
    newTag: "1.0"

secretGenerator:
  - name: app-secrets
    envs:
      - secret.env
    options:
      disableNameSuffixHash: true
