apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: accounts-prod

resources:
  - ../../base
  - route.yaml

images:
  - name: accounts
    newName: us.icr.io/accounts-namespace/accounts
    newTag: "2"

secretGenerator:
  - name: app-secrets
    envs:
      - secret.env
    type: Opaque

replicas:
  - name: accounts
    count: 3
