#
# This pipeline needs the following tasks from Tekton Catalog
#   - git-clone
#   - flake8
#   - nosetests
#   - buildah
#   - openshift-client
#
---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
    - name: branch
      default: main
    - name: image-tag
      default: "1.0"
  tasks:
    - name: init
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: cleanup

    - name: clone
      workspaces:
        - name: output
          workspace: pipeline-workspace
      taskRef:
        name: git-clone
      params:
      - name: url
        value: $(params.repo-url)
      - name: revision
        value: $(params.branch)
      runAfter:
        - init

    - name: lint
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: flake8
      params:
      - name: image
        value: python:3.9-slim
      - name: args
        value:
          - --count
          - --max-complexity=10
          - --max-line-length=127
          - --statistics
      runAfter:
        - clone

    - name: test
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: nosetests
      params:
      - name: image
        value: python:3.9-slim
      - name: database-url
        value: postgresql://postgres:postgres@localhost:5432/testdb
      - name: requirements
        value: requirements.txt
      runAfter:
        - clone

    - name: build-image
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
      - name: IMAGE
        value: localhost:32000/accounts:$(params.image-tag)
      - name: DOCKERFILE
        value: ./Dockerfile
      - name: CONTEXT
        value: .
      - name: TLSVERIFY
        value: "false"
      runAfter:
        - lint
        - test

    - name: deploy
      workspaces:
        - name: manifest-dir
          workspace: pipeline-workspace
      taskRef:
        name: openshift-client
        kind: ClusterTask
      params:
      - name: SCRIPT
        value: |
          set -e
          kubectl apply -k deploy/overlays/k3d
          kubectl set image deployment/accounts app=localhost:32000/accounts:$(params.image-tag) --record
          kubectl rollout status deployment/accounts --timeout=300s
          kubectl get pods -l app=accounts
      runAfter:
        - build-image
