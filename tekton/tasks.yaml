---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: python:3.9-slim
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        # Delete any existing contents of the directory if it exists.
        #
        # We don't just "rm -rf ${WORKSPACE_SOURCE_PATH}" because ${WORKSPACE_SOURCE_PATH} might be "/"
        # or the root of a mounted volume.
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          # Delete non-hidden files and directories
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          # Delete files and directories starting with . but excluding ..
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          # Delete files and directories starting with .. plus any other character
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: kubectl-deploy
spec:
  description: >-
    This task applies Kubernetes manifests using kubectl kustomize
    and performs a rolling restart of the accounts deployment.
  workspaces:
    - name: source
  params:
    - name: image-tag
      description: The image tag to deploy
      default: "2"
    - name: kustomize-dir
      description: Path to the kustomize overlay directory
      default: deploy/overlays/k3d
  steps:
    - name: deploy
      image: alpine/kubectl:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e

        echo "=== Applying kustomize overlay: $(params.kustomize-dir) ==="
        kubectl kustomize $(params.kustomize-dir) | kubectl apply -f -

        echo "=== Updating deployment image ==="
        kubectl set image deployment/accounts \
          accounts=us.icr.io/accounts-namespace/accounts:$(params.image-tag) \
          --record

        echo "=== Waiting for rollout to complete ==="
        kubectl rollout status deployment/accounts --timeout=300s

        echo "=== Current pods ==="
        kubectl get pods -l app=accounts
