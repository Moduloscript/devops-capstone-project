apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  generateName: accounts-cd-pr-
spec:
  serviceAccountName: pipeline
  pipelineRef:
    name: cd-pipeline
  workspaces:
    - name: pipeline-workspace
      persistentVolumeClaim:
        claimName: pipelinerun-pvc
  params:
    - name: repo-url
      value: https://github.com/Moduloscript/devops-capstone-project
    - name: branch
      value: main
    - name: image-tag
      value: "1.0"
